# Blueprint Render — revisión en la nube
# Guía paso a paso: docs/RENDER-ULTIMO-INTENTO.md

services:
  - type: web
    name: examen-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile.cloud
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: DEBUG
        value: "false"
      - key: NEO4J_URI
        value: bolt://localhost:7687
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: EMBEDDING_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: https://examen-web.onrender.com
      - key: CONTENT_PATH
        value: .
      - key: APP_ENV
        value: production

  - type: web
    name: examen-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://examen-api.onrender.com/api/v1
