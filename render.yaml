# Blueprint Render — revisión en la nube
# Tras cambiar este archivo: borra los servicios viejos en Render y vuelve a aplicar el Blueprint.

services:
  - type: web
    name: examen-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: DEBUG
        value: "false"
      - key: NEO4J_URI
        value: bolt://localhost:7687
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: EMBEDDING_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: examen-web
          property: host
      - key: CONTENT_PATH
        value: .
      - key: APP_ENV
        value: production

  - type: web
    name: examen-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: API_PROXY_TARGET
        fromService:
          type: web
          name: examen-api
          property: hostport
      - key: NODE_ENV
        value: production
