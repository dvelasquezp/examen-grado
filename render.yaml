# Blueprint Render — revisión en la nube
# Guía paso a paso: docs/DEPLOY-REVISION-NUBE.md
#
# Aquí sólo vive la API. La web está en Vercel, que no duerme ni consume las
# 750 horas de instancia que Render reparte entre los servicios gratuitos: con
# un único servicio, esa cuota alcanza para mantener la API despierta.
#
# Render añade un sufijo aleatorio a los hosts (examen-api-03dx...). Si borras
# y recreas el servicio, actualiza API_PROXY_TARGET en Vercel con el host que
# muestre el dashboard.

services:
  - type: web
    name: examen-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile.cloud
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: DEBUG
        value: "false"
      - key: NEO4J_URI
        value: bolt://localhost:7687
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: EMBEDDING_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: https://examen-grado-five.vercel.app
      - key: CONTENT_PATH
        value: /app/content
      - key: APP_ENV
        value: production
