# Paquete de revisión — un solo comando, sin Node/Python locales.
# Requisito en el PC del revisor: Docker Desktop (Mac/Windows/Linux).
#
# Uso:
#   docker compose -f docker-compose.review.yml up --build
#
# App: http://localhost:3000

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: examen-review-postgres
    environment:
      POSTGRES_USER: examen
      POSTGRES_PASSWORD: examen
      POSTGRES_DB: examen_grado
    volumes:
      - review_postgres_data:/var/lib/postgresql/data
      - ./data/review-seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examen -d examen_grado"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: examen-review-neo4j
    environment:
      NEO4J_AUTH: neo4j/examen_grado_secret
    volumes:
      - review_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: examen-review-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: examen-review-api
    env_file:
      - .env.review
    environment:
      CONTENT_PATH: /app/content
    ports:
      - "8000:8000"
    volumes:
      - .:/app/content:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    entrypoint: ["/app/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: examen-review-web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  review_postgres_data:
  review_neo4j_data:
