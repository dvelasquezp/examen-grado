services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: examen-postgres
    environment:
      POSTGRES_USER: examen
      POSTGRES_PASSWORD: examen
      POSTGRES_DB: examen_grado
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examen -d examen_grado"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: examen-neo4j
    environment:
      NEO4J_AUTH: neo4j/examen_grado_secret
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: examen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: examen-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: examen_minio
      MINIO_ROOT_PASSWORD: examen_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: examen-api
    env_file:
      - .env
    environment:
      CONTENT_PATH: /app/content
    ports:
      - "8000:8000"
    volumes:
      - .:/app/content:ro
      - ./apps/api/src:/app/src
      - models_cache:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: examen-worker
    command: celery -A src.infrastructure.messaging.celery_app worker --loglevel=info -Q ingestion,extraction,embedding,generation,sync
    env_file:
      - .env
    environment:
      CONTENT_PATH: /app/content
    volumes:
      - .:/app/content:ro
      - ./apps/api/src:/app/src
      - models_cache:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: examen-web
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  minio_data:
  models_cache:
